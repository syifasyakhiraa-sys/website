<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data Diri</title>

    <!-- Menghubungkan HTML dengan CSS -->
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="container">

        <h1>Form Data Diri</h1>
        <p class="subtitle">Silakan isi data diri Anda dibawah ini dengan lengkap.</p>

        <form>

            <!-- Text -->
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="nama lengkap anda">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="masukkan password">
            </div>

            <!-- Select Option -->
            <div class="form-group">
                <label for="jurusan">Jurusan</label>
                <select id="jurusan" name="jurusan">
                    <option value="">-- Pilih Jurusan --</option>
                    <option value="teknologi-informasi">Teknologi Informasi</option>
                    <option value="sistem-informasi">Sistem Informasi</option>
                    <option value="informatika">Informatika</option>
                    <option value="teknik-komputer">Teknik Komputer</option>
                </select>
            </div>

            <!-- Radio Button -->
            <div class="form-group">
                <label>Jenis Kelamin</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="jenis_kelamin" value="laki-laki">
                        Laki-laki
                    </label>

                    <label>
                        <input type="radio" name="jenis_kelamin" value="perempuan">
                        Perempuan
                    </label>
                </div>
            </div>

            <!-- Textarea -->
<div class="form-group">
<label for="alamat">Alamat</label>
<textarea id="alamat" name="alamat" rows="4"
placeholder="Masukkan alamat lengkap"></textarea>
</div>

<!-- Checkbox -->
<div class="form-group">
<label>Hobi</label>

<div class="checkbox-group">
<label>
<input type="checkbox" name="hobi" value="membaca">
membaca
</label>

<label>
<input type="checkbox" name="hobi" value="olahraga">
olahraga
</label>

<label>
<input type="checkbox" name="hobi" value="musik">
musik
</label>

<label>
<input type="checkbox" name="hobi" value="gaming">
gaming
</label>

<label>
<input type="checkbox" name="hobi" value="masak">
masak
</label>
</div>
</div>

<!-- Submit -->
<button type="submit">Kirim Data</button>

</form>
</div>

</body>
</html>
