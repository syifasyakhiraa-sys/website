<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <h1>Kalkulator Sederhana Syifa</h1>

    <form>

        <label for="bilangan1">Input Bilangan 1</label>
        <input type="number" id="bilangan1">

        <label for="bilangan2">Input Bilangan 2</label>
        <input type="number" id="bilangan2">

        <div class="tombol">
            <button type="button" onclick="hitung('+')">+</button>
            <button type="button" onclick="hitung('-')">-</button>
            <button type="button" onclick="hitung('*')">×</button>
            <button type="button" onclick="hitung('/')">/</button>
        </div>

        <label for="hasil">Output</label>
        <input type="text" id="hasil" readonly>

    </form>

    <script src="script.js"></script>

</body>
</html>
